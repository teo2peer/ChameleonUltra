name: PR handler
on:
  pull_request:

permissions:
  contents: read

jobs:
  firmware_pipeline:
    name: Build Firmware
    uses: ./.github/workflows/build_firmware.yml
    with:
      checkout-sha: "${{ github.event.pull_request.head.sha }}"
      package: false
  client_pipeline:
    name: Build Firmware
    uses: ./.github/workflows/build_client.yml
    with:
      checkout-sha: "${{ github.event.pull_request.head.sha }}"
