name: Push handler

on:
  push:

concurrency:
  group: push-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware_pipeline:
    name: Build Firmware
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build_firmware.yml
    with:
      package: true
    secrets:
      DFU_SIGNING_KEY: ${{ secrets.DFU_SIGNING_KEY }}
  firmware_verify:
    name: Verify Firmware
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build_firmware.yml
    with:
      package: false
  verification:
    name: Tests and safety gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project software --dev
      - run: uv run --project software python .github/scripts/run_hardware_free_python_tests.py
      - name: Lint and type-check Python
        working-directory: software
        run: |
          uv run ruff check .
          uv run pyrefly check
      - run: make -C firmware/tests test SANITIZE=1
      - run: |
          HW_VERSION=0 .github/scripts/validate_firmware_release.sh --device ultra
          HW_VERSION=1 .github/scripts/validate_firmware_release.sh --device lite
          .github/scripts/check_no_new_secrets.sh
  client_pipeline:
    name: Build Firmware
    uses: ./.github/workflows/build_client.yml
  firmware_artifacts:
    name: Validate firmware artifacts (${{ matrix.device_type }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - firmware_pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device_type: [ultra, lite]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.device_type }}-firmware-debug
          path: firmware-artifacts
      - run: .github/scripts/check_firmware_artifacts.sh firmware-artifacts
  create_dev_release:
    permissions:
      contents: write
    name: Create dev pre-release with artifacts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - firmware_pipeline
      - client_pipeline
      - verification
      - firmware_artifacts
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release-artifacts
      - name: Upload to dev release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            Auto-Generated DFU packages from latest `main` commit.
            For development purposes only. 
            These are not tested, here be dragons.
            Built from commit ${{ github.sha }}
          tag_name: dev-${{ github.sha }}
          name: Development release ${{ github.sha }}
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/*
  create_release:
    permissions:
      contents: write
    name: Create tagged release with artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - firmware_pipeline
      - client_pipeline
      - verification
      - firmware_artifacts
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release-artifacts
      - name: Upload to tagged release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            Auto-Generated DFU packages for Release ${{ github.ref_name }}
            Built from commit ${{ github.sha }}
          name: Release ${{ github.ref_name }}
          draft: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          append_body: true
          files: release-artifacts/*
