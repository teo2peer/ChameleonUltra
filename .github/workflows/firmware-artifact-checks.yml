name: Firmware artifact budgets

on:
  workflow_run:
    workflows: ["PR handler", "Push handler"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Workflow run containing *-firmware-debug artifacts
        required: true
        type: string

jobs:
  check-reports:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate source workflow
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run-id || github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('Invalid workflow run ID.');
              return;
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const allowedWorkflows = new Map([
              ['PR handler', '.github/workflows/on_pr.yml'],
              ['Push handler', '.github/workflows/on_push.yml'],
            ]);
            if (allowedWorkflows.get(run.name) !== run.path || run.status !== 'completed' ||
                run.conclusion !== 'success' ||
                run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Artifacts must come from a successful trusted source workflow.');
            }
      - name: Download link and size reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-firmware-debug"
          path: firmware-reports
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run-id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate Ultra and Lite budgets
        run: |
          checked=0
          for report_dir in firmware-reports/*-firmware-debug; do
            [ -d "$report_dir" ] || continue
            bash .github/scripts/check_firmware_artifacts.sh "$report_dir"
            checked=$((checked + 1))
          done
          if [ "$checked" -ne 2 ]; then
            echo "Expected Ultra and Lite debug artifacts; checked $checked." >&2
            exit 1
          fi
