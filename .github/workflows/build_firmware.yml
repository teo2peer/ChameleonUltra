name: Firmware build

on:
  workflow_call:
    inputs:
      checkout-sha:
        required: false
        type: string
      package:
        description: Generate externally signed DFU release packages
        required: false
        default: false
        type: boolean
    secrets:
      DFU_SIGNING_KEY:
        description: PEM private key contents used only for signed package builds
        required: false

jobs:
  build_fw:
    name: Build firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        device_type: [ultra, lite]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build isolated firmware toolchain image
        run: docker build -t chameleon-fw-builder firmware
      - name: Build firmware
        env:
          repo: ${{ github.repository }}
          PACKAGE_FIRMWARE: ${{ inputs.package }}
          DFU_SIGNING_KEY_CONTENT: ${{ secrets.DFU_SIGNING_KEY }}
        run: |
          args=(--rm -v "${PWD}:/workdir" -e CURRENT_DEVICE_TYPE=${{ matrix.device_type }})
          mode=compile
          if [[ "$PACKAGE_FIRMWARE" == "true" ]]; then
            if [[ -z "$DFU_SIGNING_KEY_CONTENT" ]]; then
              echo "Signed package build requires the DFU_SIGNING_KEY repository secret." >&2
              exit 1
            fi
            key_file="$RUNNER_TEMP/dfu-signing-key.pem"
            printf '%s' "$DFU_SIGNING_KEY_CONTENT" > "$key_file"
            chmod 600 "$key_file"
            args+=(-v "$key_file:/run/secrets/dfu-signing-key.pem:ro" -e DFU_SIGNING_KEY=/run/secrets/dfu-signing-key.pem)
            mode=package
          fi
          docker run "${args[@]}" chameleon-fw-builder firmware/build.sh "$mode"
      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device_type }}-firmware
          path: firmware/objects/*.hex
      - name: Upload link and size reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device_type }}-firmware-debug
          path: |
            firmware/objects/*.out
            firmware/objects/*.elf
            firmware/objects/*.map
            firmware/objects/*size*.txt
          if-no-files-found: ignore
      - name: Unzip dfu images
        if: inputs.package
        run: |
          sudo chown -R $USER:$USER firmware/objects
          mkdir firmware/objects/${{ matrix.device_type }}-dfu-full
          unzip firmware/objects/${{ matrix.device_type }}-dfu-full.zip -d firmware/objects/${{ matrix.device_type }}-dfu-full
      - name: Upload dfu full image
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device_type }}-dfu-full
          path: firmware/objects/${{ matrix.device_type }}-dfu-full/*
      - name: Upload release artifacts
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.device_type }}
          path: firmware/objects/*.zip
